name: Bilibili Data Crawler

on:
  workflow_dispatch: # 支持手动触发测试
  schedule:
    # UTC 00:00 每月1号 = 北京时间 08:00 每月1号
    - cron: '50 10 3 * *'

jobs:
  run_task:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 配置Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 执行爬虫脚本
        run: python bili_stat.py

      - name: 提交变更文件
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add bili_data.xlsx report.html
          git diff --quiet && echo "无数据更新" || (git commit -m "【月度采集】更新B站统计数据 $(date +'%Y-%m-%d')" && git push)
